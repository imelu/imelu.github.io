<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Portfolio - Luca Imesch" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Luca Imesch</title>
    <!-- Fonts must not delay the portfolio when Google's servers are unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat&family=Rubik:wght@300&display=swap" media="print" onload="this.media='all'">
    <!-- React Scripts inserts the current hashed assets during the build. -->
    <style>
      html { background: #181818; color: #fff; }
      .startup-fallback { max-width: 40rem; margin: 10vh auto; padding: 24px; font: 18px/1.5 sans-serif; }
      .startup-fallback a { color: #6da8ca; }
    </style>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // This script checks to see if a redirect is present in the query string,
        // converts it back into the correct url and adds it to the
        // browser's history using window.history.replaceState(...),
        // which won't cause the browser to attempt to load the new url.
        // When the single page app is loaded further down in this file,
        // the correct url will be waiting in the browser's history for
        // the single page app to route accordingly.
        (function(l) {
          if (l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) { 
              return s.replace(/~and~/g, '&')
            }).join('?');
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + decoded + l.hash
            );
          }
        }(window.location))
      </script>
      <!-- End Single Page Apps for GitHub Pages -->
</head>

<body>
    <div id="root">
      <main class="startup-fallback">
        <h1>Luca Imesch</h1>
        <p>Game Designer and Programmer</p>
        <p id="startup-status" role="status">Loading projects…</p>
        <noscript><p>Please enable JavaScript to view the interactive portfolio.</p></noscript>
        <a href="mailto:luca-imesch@hotmail.ch">luca-imesch@hotmail.ch</a>
      </main>
    </div>
    <script>
      window.setTimeout(function () {
        var status = document.getElementById('startup-status');
        if (status) {
          status.textContent = 'The portfolio could not finish loading. Please reload the page, or contact me by email.';
        }
      }, 15000);
    </script>
</body>

</html>
